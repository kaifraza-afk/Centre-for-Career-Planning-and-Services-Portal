name: Build, Push & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check changed files
        id: changes
        run: |
          echo "frontend=$(git diff --name-only HEAD~1 HEAD | grep -c '^frontend/')" >> $GITHUB_OUTPUT
          echo "backend=$(git diff --name-only HEAD~1 HEAD | grep -c '^backend/')" >> $GITHUB_OUTPUT
          echo "nginx=$(git diff --name-only HEAD~1 HEAD | grep -c '^nginx/')" >> $GITHUB_OUTPUT
          echo "ml=$(git diff --name-only HEAD~1 HEAD | grep -c '^ml/')" >> $GITHUB_OUTPUT

      - name: Build & push frontend image
        if: steps.changes.outputs.frontend != '0'
        run: |
          DOCKER_BUILDKIT=1 docker build --compress \
            --build-arg VITE_BACKEND_URL="" \
            --build-arg VITE_ML_API_URL="/api/ml" \
            -t mdkaifraza/ccps-frontend:latest \
            -f frontend/Dockerfile .
          docker push mdkaifraza/ccps-frontend:latest

      - name: Build & push backend image
        if: steps.changes.outputs.backend != '0'
        run: |
          DOCKER_BUILDKIT=1 docker build --compress \
            -t mdkaifraza/ccps-backend:latest \
            -f backend/Dockerfile .
          docker push mdkaifraza/ccps-backend:latest

      - name: Build & push nginx image
        if: steps.changes.outputs.nginx != '0'
        run: |
          DOCKER_BUILDKIT=1 docker build --compress \
            -t mdkaifraza/ccps-nginx:latest \
            -f nginx/Dockerfile .
          docker push mdkaifraza/ccps-nginx:latest

      - name: Build & push ml image
        if: steps.changes.outputs.ml != '0'
        run: |
          DOCKER_BUILDKIT=1 docker build --compress \
            -t mdkaifraza/ccps-ml:latest \
            -f ml/Dockerfile .
          docker push mdkaifraza/ccps-ml:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Check changed files
        id: changes
        run: |
          echo "frontend=$(git diff --name-only HEAD~1 HEAD | grep -c '^frontend/')" >> $GITHUB_OUTPUT
          echo "backend=$(git diff --name-only HEAD~1 HEAD | grep -c '^backend/')" >> $GITHUB_OUTPUT
          echo "nginx=$(git diff --name-only HEAD~1 HEAD | grep -c '^nginx/')" >> $GITHUB_OUTPUT
          echo "ml=$(git diff --name-only HEAD~1 HEAD | grep -c '^ml/')" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FRONTEND_CHANGED,BACKEND_CHANGED,NGINX_CHANGED,ML_CHANGED
          script: |
            [ "${{ steps.changes.outputs.frontend }}" != "0" ] && kubectl rollout restart deployment/frontend
            [ "${{ steps.changes.outputs.backend }}" != "0" ] && kubectl rollout restart deployment/backend
            [ "${{ steps.changes.outputs.nginx }}" != "0" ] && kubectl rollout restart deployment/nginx
            [ "${{ steps.changes.outputs.ml }}" != "0" ] && kubectl rollout restart deployment/ml
            kubectl get pods