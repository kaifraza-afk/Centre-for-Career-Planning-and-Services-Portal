name: Build, Push & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push frontend image
        run: |
          DOCKER_BUILDKIT=1 docker build --compress \
            --build-arg VITE_BACKEND_URL="" \
            --build-arg VITE_ML_API_URL="/api/ml" \
            -t mdkaifraza/ccps-frontend:latest \
            -f frontend/Dockerfile .
          docker push mdkaifraza/ccps-frontend:latest

      - name: Build & push backend image
        run: |
          DOCKER_BUILDKIT=1 docker build --compress \
            -t mdkaifraza/ccps-backend:latest \
            -f backend/Dockerfile .
          docker push mdkaifraza/ccps-backend:latest

      - name: Build & push nginx image
        run: |
          DOCKER_BUILDKIT=1 docker build --compress \
            -t mdkaifraza/ccps-nginx:latest \
            -f nginx/Dockerfile .
          docker push mdkaifraza/ccps-nginx:latest

      - name: Build & push ml image
        run: |
          DOCKER_BUILDKIT=1 docker build --compress \
            -t mdkaifraza/ccps-ml:latest \
            -f ml/Dockerfile .
          docker push mdkaifraza/ccps-ml:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl rollout restart deployment/frontend
            kubectl rollout restart deployment/backend
            kubectl rollout restart deployment/nginx
            kubectl rollout restart deployment/ml
            kubectl rollout status deployment/frontend
            kubectl rollout status deployment/backend
            kubectl rollout status deployment/nginx
            kubectl rollout status deployment/ml