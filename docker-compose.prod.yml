version: "3.9"

services:
  backend:
    image: mdkaifraza/ccps-backend:latest
    environment:
      MONGO_URI: "mongodb://ccps-mongo:27017"
      PORT: 5000
      JWT_SECRET: your_jwt_secret
      SMTP_USER: mdkaifra251@gmail.com
      SMTP_PASSWORD: "ijiu wlbm xznn ngkp"
      SMTP_SENDER_EMAIL: mdkaifraza251@gmail.com
      FRONTEND_URL: http://localhost
      NODE_ENV: "production"
    networks:
      - app-network

  frontend:
    image: mdkaifraza/ccps-frontend:latest
    environment:
      VITE_BACKEND_URL: ''
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - app-network

  ccps-mongo:
    image: mongo:6
    container_name: ccps-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: kaifraza
      MONGO_INITDB_ROOT_PASSWORD: Kaif@81026
    restart: always
    networks:
      - app-network
  ml:
    image: mdkaifraza/ccps-ml:latest
    container_name: ml
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge