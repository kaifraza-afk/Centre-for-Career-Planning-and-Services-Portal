version: "3.9"

services:
  mongo:
    image: mongo:6.0
    container_name: ccps-mongo
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: ccps-backend
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ccps
      - JWT_SECRET=your_jwt_secret
      - CLOUDINARY_API_KEY=your_cloudinary_key
      - CLOUDINARY_API_SECRET=your_cloudinary_secret
      - SMTP_USER=your_email
      - SMTP_PASSWORD=your_password
      - SMTP_SENDER_EMAIL=your_email
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: ccps-frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ccps-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
  ml:
    build: ./ml
    container_name: ml
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-network
volumes:
  mongo-data: